name: Apply WS-08 runtime dependency split

on:
  push:
    branches:
      - release/ws-08-runtime-dependency-split

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[ws08-runtime-deps-done]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Reclassify frontend build dependencies
        run: |
          node --input-type=module <<'NODE'
          import { readFile, writeFile } from 'node:fs/promises';
          const path = 'package.json';
          const pkg = JSON.parse(await readFile(path, 'utf8'));
          for (const name of ['lucide-react', 'react', 'react-dom', 'react-router-dom']) {
            pkg.devDependencies[name] = pkg.dependencies[name];
            delete pkg.dependencies[name];
          }
          pkg.devDependencies = Object.fromEntries(Object.entries(pkg.devDependencies).sort(([a], [b]) => a.localeCompare(b)));
          await writeFile(path, `${JSON.stringify(pkg, null, 2)}\n`);
          NODE
          npm install --package-lock-only
      - name: Remove temporary workflow and commit generated metadata
        run: |
          rm .github/workflows/apply-ws08-runtime-dependency-split.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.json package-lock.json .github/workflows/apply-ws08-runtime-dependency-split.yml
          git commit -m 'chore(packaging): isolate runtime npm dependencies [ws08-runtime-deps-done]'
          git push
