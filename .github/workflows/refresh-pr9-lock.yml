name: Refresh PR9 lockfile

on:
  push:
    branches:
      - test/browser-a11y-smoke

permissions:
  contents: write

jobs:
  refresh-lock:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: test/browser-a11y-smoke

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Refresh lockfile
        run: npm install --package-lock-only --ignore-scripts

      - name: Commit lockfile and remove one-shot workflow
        run: |
          rm .github/workflows/refresh-pr9-lock.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json .github/workflows/refresh-pr9-lock.yml
          git commit -m "build: refresh npm lockfile for browser smoke gates"
          git push origin HEAD:test/browser-a11y-smoke
