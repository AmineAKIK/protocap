name: Live smoke

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'scripts/live-smoke.mjs'
      - 'tests/liveSmoke.test.mjs'
      - '.github/workflows/live-smoke.yml'
      - 'docs/release-and-operations.md'
      - 'docs/release-evidence/**'
      - 'docs/remediation-plan.md'
  schedule:
    - cron: '17 6 * * *'

permissions:
  contents: read

concurrency:
  group: live-smoke-production
  cancel-in-progress: true

jobs:
  smoke:
    name: Production live smoke
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      PROTOCAP_BASE_URL: https://protocap-production.up.railway.app
      PROTOCAP_DEMO_BASE_URL: https://protocap-demo-production.up.railway.app

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc

      - name: Probe protected and demo public surfaces
        run: |
          mkdir -p test-results/live-smoke
          npm run smoke:live | tee test-results/live-smoke/output.txt

      - name: Upload live smoke evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: live-smoke-${{ github.run_id }}-${{ github.run_attempt }}
          path: test-results/live-smoke/output.txt
          if-no-files-found: warn
          retention-days: 14
