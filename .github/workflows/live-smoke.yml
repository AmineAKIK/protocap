name: Live smoke

on:
  workflow_dispatch:
  schedule:
    - cron: '17 6 * * *'

permissions:
  contents: read

concurrency:
  group: live-smoke-production
  cancel-in-progress: true

jobs:
  smoke:
    name: Production live smoke
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      PROTOCAP_BASE_URL: https://protocap-production.up.railway.app

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc

      - name: Probe public production surfaces
        run: npm run smoke:live
