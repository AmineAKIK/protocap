name: PR-03 final portable regression proof
on:
  push:
    branches: [work/pr03-correction-preparation]
    paths: [.github/workflows/pr03-final-proof.yml]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: e9784980433cc871e956f0cce647e8f835e860b5
          path: parent
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: 52d2384405e14364393b1b96eb33a8863c2bbb9d
          path: candidate
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: candidate/.nvmrc
      - name: Install exact graphs
        run: npm ci --prefix parent && npm ci --prefix candidate
      - name: Verify three real defects on the parent and their absence on the candidate
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { copyFileSync, readFileSync } from 'node:fs';
          import { createHash } from 'node:crypto';
          import { execFileSync, spawnSync } from 'node:child_process';
          const parentSha = 'e9784980433cc871e956f0cce647e8f835e860b5';
          const candidateSha = '52d2384405e14364393b1b96eb33a8863c2bbb9d';
          const test = 'src/pages/ExpiryTemporalRegression.test.tsx';
          const setup = 'src/test/setup.ts';
          for (const [directory, sha] of [['parent', parentSha], ['candidate', candidateSha]]) {
            assert.equal(execFileSync('git', ['rev-parse', 'HEAD'], { cwd: directory, encoding: 'utf8' }).trim(), sha);
          }
          for (const path of [test, setup]) copyFileSync(`candidate/${path}`, `parent/${path}`);
          const hash = (path) => createHash('sha256').update(readFileSync(path)).digest('hex');
          for (const path of [test, setup]) assert.equal(hash(`candidate/${path}`), hash(`parent/${path}`));
          const results = [];
          for (const directory of ['parent', 'candidate']) {
            const reportPath = `/tmp/pr03-${directory}.json`;
            const result = spawnSync(process.execPath, ['node_modules/vitest/vitest.mjs', 'run', test, '--reporter=json', `--outputFile=${reportPath}`], {
              cwd: directory, env: { ...process.env, TZ: 'Europe/Paris' }, encoding: 'utf8', timeout: 90000, maxBuffer: 8 * 1024 * 1024,
            });
            if (result.error) throw result.error;
            const report = JSON.parse(readFileSync(reportPath, 'utf8'));
            const assertions = report.testResults.flatMap((suite) => suite.assertionResults);
            assert.equal(report.numTotalTests, 3);
            assert.equal(assertions.length, 3);
            assert.equal(result.signal, null);
            if (directory === 'parent') {
              assert.equal(result.status, 1);
              assert.equal(report.numFailedTests, 3);
              for (const entry of assertions) {
                assert.equal(entry.status, 'failed');
                assert.ok(entry.failureMessages.some((message) => /AssertionError/.test(message)));
                assert.ok(entry.failureMessages.every((message) => !/TypeError|showModal is not a function|Failed to load/.test(message)));
              }
            } else {
              assert.equal(result.status, 0, result.stdout + result.stderr);
              assert.equal(report.numPassedTests, 3);
              assert.equal(report.numFailedTests, 0);
            }
            const summary = { directory, exitCode: result.status, total: report.numTotalTests, passed: report.numPassedTests, failed: report.numFailedTests,
              assertions: assertions.map((entry) => ({ title: entry.title, status: entry.status, failures: entry.failureMessages.map((message) => message.slice(0, 180)) })) };
            results.push(summary);
            console.log('PR03_PORTABLE_PROOF', JSON.stringify(summary));
            execFileSync('git', ['diff', '--exit-code', '--', 'package.json', 'package-lock.json', 'src/pages/ExpiryCheckPage.tsx'], { cwd: directory, stdio: 'inherit' });
          }
          console.log('PR03_FINAL_RED_GREEN', JSON.stringify({ parentSha, candidateSha,
            testSha256: hash(`candidate/${test}`), setupSha256: hash(`candidate/${setup}`),
            timeZone: 'Europe/Paris', node: process.version, executedAt: new Date().toISOString(), results,
            runUrl: `https://github.com/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}` }));
          NODE
