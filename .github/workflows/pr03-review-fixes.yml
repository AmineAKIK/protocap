name: PR-03 review refinements
on:
  push:
    branches: [work/pr03-correction-preparation]
    paths: [.github/workflows/pr03-review-fixes.yml]
permissions:
  contents: read
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: efccf88159836c62ce5528f4cba2ffedd815301d
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc
      - name: Apply reviewed source changes and export verified blobs only
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { readFileSync, writeFileSync } from 'node:fs';
          import { createHash } from 'node:crypto';
          function replace(text, from, to, count = 1) {
            assert.equal(text.split(from).length - 1, count, `Unexpected occurrence count: ${from}`);
            return text.replaceAll(from, to);
          }
          const pagePath = 'src/pages/ExpiryCheckPage.tsx';
          let page = readFileSync(pagePath, 'utf8');
          page = replace(page, "${isSelected ? 'text-white/90' : ''}", "${isSelected && status !== 'unknown' ? 'text-white/90' : ''}");
          page = replace(page, 'whitespace-nowrap text-base font-black tabular-nums', 'break-normal text-base font-black tabular-nums', 3);
          page = replace(page, 'const vatHistory = blockHistoryGroups[0]?.vatEntries ?? [];', 'const vatHistory = blockHistoryGroups.find((group) => group.isCurrent)?.vatEntries ?? [];');
          writeFileSync(pagePath, page);
          const specPath = 'e2e/expiry-time.spec.ts';
          let spec = readFileSync(specPath, 'utf8');
          spec += `
          test.describe('Unknown Expiry states stay readable and conservative', () => {
            test.use({ timezoneId: 'Europe/Paris' });
            for (const state of ['future', 'invalid-calendar', 'missing-block'] as const) {
              test(\`T05/T42/T43: \${state} preserves data and accessible layout\`, async ({ page }) => {
                await page.addInitScript(({ state, now }) => {
                  const block = { type: 'fillingBlock', label: 'Bloc', validityDays: 5, operator: 'Fixture',
                    lastChangedAt: state === 'future' ? '2026-09-18T12:00:00.000Z' : '2026-09-15T12:00:00.000Z',
                    expiresAt: state === 'invalid-calendar' ? '2026-02-30T12:00:00.000Z' : '2026-09-23T12:00:00.000Z' };
                  localStorage.setItem('lineops.expiry.lines.v8', JSON.stringify([{ id: 'a', name: 'Ligne de conditionnement A',
                    vat: 'Cuve 1', product: 'Fixture', conditioningStartedAt: now, elements: state === 'missing-block' ? [] : [block] }]));
                  localStorage.setItem('lineops.expiry.history.v8', JSON.stringify([
                    { id: 'old-block', lineId: 'a', lineName: 'Ligne de conditionnement A', elementLabel: 'Bloc de remplissage',
                      changedAt: '2026-09-01T12:00:00.000Z', newExpiresAt: '2026-09-06T12:00:00.000Z', operator: 'Fixture' },
                    { id: 'old-refill', lineId: 'a', lineName: 'Ligne de conditionnement A', elementLabel: 'Recharge de cuve',
                      changedAt: '2026-09-02T12:00:00.000Z', newExpiresAt: '2026-09-06T12:00:00.000Z', operator: 'Fixture' },
                  ]));
                }, { state, now: NOW });
                await openExpiry(page);
                const before = await snapshot(page);
                await expect(page.getByText('Aucune recharge tracée sur ce bloc.')).toBeVisible();
                await expect(page.getByRole('button', { name: 'Déclarer un remplacement', exact: true })).toBeDisabled();
                await expect(page.getByText(/Démarrage de la ligne autorisé/)).toHaveCount(0);
                expect((await new AxeBuilder({ page }).analyze()).violations).toEqual([]);
                expect(await page.evaluate(() => document.documentElement.scrollWidth > window.innerWidth + 1)).toBe(false);
                expect(await snapshot(page)).toEqual(before);
              });
            }
          });
          `;
          writeFileSync(specPath, spec);
          for (const path of [pagePath, specPath]) {
            const content = readFileSync(path, 'utf8');
            const response = await fetch('https://api.github.com/repos/AmineAKIK/protocap/git/blobs', {
              method: 'POST', headers: { Authorization: `Bearer ${process.env.GH_TOKEN}`, Accept: 'application/vnd.github+json', 'Content-Type': 'application/json' },
              body: JSON.stringify({ content, encoding: 'utf-8' }), signal: AbortSignal.timeout(30000),
            });
            assert.equal(response.status, 201);
            const blob = await response.json();
            const bytes = Buffer.from(content);
            assert.equal(blob.sha, createHash('sha1').update(`blob ${bytes.length}\0`).update(bytes).digest('hex'));
            console.log('PR03_REVIEW_BLOB', JSON.stringify({ path, mode: '100644', type: 'blob', sha: blob.sha }));
          }
          NODE
