name: Apply Celine history count bound

on:
  push:
    branches:
      - release/ws-05-bound-celine-visible-history

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[celine-history-count-done]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: release/ws-05-bound-celine-visible-history
          fetch-depth: 0

      - name: Bound persisted visible history
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          page = Path('src/pages/shiftguide/CelinePage.tsx')
          text = page.read_text()

          def replace_one(old: str, new: str) -> None:
              global text
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'Expected one match, found {count}: {old[:120]!r}')
              text = text.replace(old, new, 1)

          replace_one(
              "const STORAGE_KEY_HISTORY = 'shiftguide_celine_history';",
              "const STORAGE_KEY_HISTORY = 'shiftguide_celine_history';\nconst MAX_PERSISTED_HISTORY_MESSAGES = 100;",
          )
          replace_one(
              "    return Array.isArray(parsed) ? parsed.filter(isValidMessage) : [];",
              "    return Array.isArray(parsed)\n      ? parsed.slice(-MAX_PERSISTED_HISTORY_MESSAGES).filter(isValidMessage)\n      : [];",
          )
          replace_one(
              "    storage.setItem(STORAGE_KEY_HISTORY, JSON.stringify(messages.filter((message) => !message.loading)));",
              "    const persistedMessages = messages\n      .filter((message) => !message.loading)\n      .slice(-MAX_PERSISTED_HISTORY_MESSAGES);\n    storage.setItem(STORAGE_KEY_HISTORY, JSON.stringify(persistedMessages));",
          )
          page.write_text(text)

          test_path = Path('src/pages/shiftguide/CelinePage.test.tsx')
          test = test_path.read_text()
          marker = "  it('restores a structurally valid persisted assistant response', () => {"
          if test.count(marker) != 1:
              raise SystemExit(f'Expected one test insertion marker, found {test.count(marker)}')
          addition = r'''  it('restores only the 100 most recent persisted messages', () => {
    localStorage.setItem(
      'shiftguide_celine_history',
      JSON.stringify(
        Array.from({ length: 101 }, (_, index) => ({
          id: `user-${index}`,
          role: 'user',
          content: `Message ${index}`,
          checklist: [],
          followUp: null,
        }))
      )
    );

    render(
      <MemoryRouter>
        <CelinePage />
      </MemoryRouter>
    );

    expect(screen.queryByText('Message 0')).toBeNull();
    expect(screen.getByText('Message 1')).toBeTruthy();
    expect(screen.getByText('Message 100')).toBeTruthy();
  });

'''
          test_path.write_text(test.replace(marker, addition + marker, 1))
          PY

      - name: Remove temporary workflow and commit final diff
        shell: bash
        run: |
          rm .github/workflows/apply-celine-history-count-bound.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/shiftguide/CelinePage.tsx src/pages/shiftguide/CelinePage.test.tsx .github/workflows/apply-celine-history-count-bound.yml
          git commit -m "fix(persistence): bound Celine visible history [celine-history-count-done]"
          git push origin HEAD:release/ws-05-bound-celine-visible-history
