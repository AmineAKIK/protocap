name: Apply Celine history validation

on:
  push:
    branches:
      - release/ws-05-celine-history-validation

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[celine-history-validation-done]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: release/ws-05-celine-history-validation
          fetch-depth: 0

      - name: Harden persisted Celine history validation
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          page = Path('src/pages/shiftguide/CelinePage.tsx')
          text = page.read_text()

          def replace_one(old: str, new: str) -> None:
              global text
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'Expected one match, found {count}: {old[:120]!r}')
              text = text.replace(old, new, 1)

          replace_one(
              "import type {\n  SharedCelinePresentation,\n  SharedCelineWorkflow,\n  SharedCompletedCelineWorkflow,\n} from '../../../shared/celineContract.js';",
              "import {\n  isCelineResponse,\n  type SharedCelinePresentation,\n  type SharedCelineWorkflow,\n  type SharedCompletedCelineWorkflow,\n} from '../../../shared/celineContract.js';",
          )

          replace_one(
              "function isValidMessage(value: unknown): value is CelineMessage {\n  if (!value || typeof value !== 'object') return false;\n  const message = value as Record<string, unknown>;\n  return (\n    typeof message.id === 'string' &&\n    (message.role === 'user' || message.role === 'assistant') &&\n    typeof message.content === 'string' &&\n    Array.isArray(message.checklist) &&\n    (message.followUp === null || typeof message.followUp === 'string')\n  );\n}",
              "function isValidChecklistItem(value: unknown): value is ChecklistItem {\n  if (!value || typeof value !== 'object' || Array.isArray(value)) return false;\n  const item = value as Record<string, unknown>;\n  return (\n    typeof item.id === 'string' &&\n    item.id.length > 0 &&\n    typeof item.done === 'boolean' &&\n    typeof item.na === 'boolean' &&\n    !(item.done && item.na)\n  );\n}\n\nfunction isValidMessage(value: unknown): value is CelineMessage {\n  if (!value || typeof value !== 'object' || Array.isArray(value)) return false;\n  const message = value as Record<string, unknown>;\n  if (typeof message.id !== 'string' || message.id.length === 0) return false;\n  if (message.role !== 'user' && message.role !== 'assistant') return false;\n  if (typeof message.content !== 'string' || message.content.length === 0) return false;\n  if (!Array.isArray(message.checklist) || !message.checklist.every(isValidChecklistItem)) return false;\n  if (message.loading !== undefined && message.loading !== false) return false;\n\n  if (message.role === 'user') {\n    return (\n      message.checklist.length === 0 &&\n      message.followUp === null &&\n      message.presentation === undefined &&\n      message.workflow === undefined &&\n      message.completedWorkflow === undefined\n    );\n  }\n\n  return isCelineResponse({\n    message: message.content,\n    checklist: message.checklist,\n    followUp: message.followUp,\n    presentation: message.presentation,\n    workflow: message.workflow,\n    completedWorkflow: message.completedWorkflow,\n  });\n}",
          )

          page.write_text(text)

          test_path = Path('src/pages/shiftguide/CelinePage.test.tsx')
          test = test_path.read_text()
          insert = r'''\n\ndescribe('CelinePage persisted history validation', () => {\n  it('drops a malformed persisted checklist instead of rendering invalid items', () => {\n    localStorage.setItem(\n      'shiftguide_celine_history',\n      JSON.stringify([\n        {\n          id: 'assistant-corrupt',\n          role: 'assistant',\n          content: 'Réponse persistée',\n          checklist: [null],\n          followUp: null,\n        },\n      ])\n    );\n\n    render(\n      <MemoryRouter>\n        <CelinePage />\n      </MemoryRouter>\n    );\n\n    expect(screen.queryByText('Réponse persistée')).toBeNull();\n    expect(screen.getByText('Que se passe-t-il sur la ligne ?')).toBeTruthy();\n  });\n\n  it('restores a structurally valid persisted assistant response', () => {\n    localStorage.setItem(\n      'shiftguide_celine_history',\n      JSON.stringify([\n        {\n          id: 'assistant-valid',\n          role: 'assistant',\n          content: 'Réponse persistée valide',\n          checklist: [],\n          followUp: null,\n          presentation: 'answer',\n        },\n      ])\n    );\n\n    render(\n      <MemoryRouter>\n        <CelinePage />\n      </MemoryRouter>\n    );\n\n    expect(screen.getByText('Réponse persistée valide')).toBeTruthy();\n  });\n});\n'''.replace('\\n', '\n')
          test_path.write_text(test.rstrip() + insert)
          PY

      - name: Remove temporary workflow and commit final diff
        shell: bash
        run: |
          rm .github/workflows/apply-celine-history-validation.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/shiftguide/CelinePage.tsx src/pages/shiftguide/CelinePage.test.tsx .github/workflows/apply-celine-history-validation.yml
          git commit -m "fix(persistence): validate Celine persisted history [celine-history-validation-done]"
          git push origin HEAD:release/ws-05-celine-history-validation
