name: WS-07 dependency diagnostic

on:
  push:
    branches:
      - audit/ws-07-dependency-diagnostics

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install locked graph
        run: npm ci
      - name: Capture full audit before repair
        run: npm audit --json || true
      - name: Simulate compatible lockfile repair
        run: npm audit fix --package-lock-only
      - name: Show lockfile-only repair
        run: |
          git status --short
          git diff --stat -- package-lock.json
          git diff -- package-lock.json
      - name: Capture full audit after repair
        run: npm audit --json || true
      - name: Capture production audit after repair
        run: npm audit --omit=dev --json || true
