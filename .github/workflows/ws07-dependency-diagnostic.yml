name: WS-07 dependency diagnostic

on:
  push:
    branches:
      - audit/ws-07-dependency-diagnostics

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install locked graph
        run: npm ci
      - name: Repair compatible transitive advisories
        run: npm audit fix --package-lock-only
      - name: Approve reviewed esbuild install script
        run: npm approve-scripts esbuild
      - name: Show proposed supply-chain diff
        run: |
          git status --short
          git diff --stat -- package.json package-lock.json
          git diff -- package.json package-lock.json
      - name: Reinstall from proposed metadata
        run: npm ci
      - name: Verify full audit after repair
        run: npm audit --json
      - name: Verify production audit after repair
        run: npm audit --omit=dev --json
