name: Apply Celine history bounds

on:
  push:
    branches:
      - release/ws-05-celine-history-validation

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[celine-history-bounds-done]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: release/ws-05-celine-history-validation
          fetch-depth: 0

      - name: Apply pre-iteration bounds
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          page = Path('src/pages/shiftguide/CelinePage.tsx')
          text = page.read_text()
          old = "  if (typeof message.content !== 'string' || message.content.length === 0) return false;\n  if (!Array.isArray(message.checklist) || !message.checklist.every(isValidChecklistItem)) return false;"
          new = "  if (typeof message.content !== 'string' || message.content.length === 0 || message.content.length > 20_000) return false;\n  if (!Array.isArray(message.checklist) || message.checklist.length > 100) return false;\n  if (!message.checklist.every(isValidChecklistItem)) return false;"
          if text.count(old) != 1:
              raise SystemExit(f'Expected one validator anchor, found {text.count(old)}')
          page.write_text(text.replace(old, new, 1))
          PY

      - name: Remove temporary workflow and commit final diff
        shell: bash
        run: |
          rm .github/workflows/apply-celine-history-bounds.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/shiftguide/CelinePage.tsx .github/workflows/apply-celine-history-bounds.yml
          git commit -m "fix(persistence): bound Celine history validation [celine-history-bounds-done]"
          git push origin HEAD:release/ws-05-celine-history-validation
