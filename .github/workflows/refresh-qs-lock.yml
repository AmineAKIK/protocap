name: Refresh qs lock

on:
  push:
    branches:
      - release/ws-07-qs-advisory

permissions:
  contents: write

jobs:
  refresh:
    if: ${{ !contains(github.event.head_commit.message, '[lock-refresh-done]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - name: Refresh qs transitive lock
        run: npm update qs --package-lock-only --ignore-scripts
      - name: Verify production audit
        run: npm audit --omit=dev
      - name: Remove temporary workflow and commit generated lock
        run: |
          git rm .github/workflows/refresh-qs-lock.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "fix(deps): refresh qs to patched release [lock-refresh-done]"
          git push
