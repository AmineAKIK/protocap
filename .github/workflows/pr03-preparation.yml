name: PR-03 parent regression proof

on:
  push:
    branches: [work/pr03-correction-preparation]

permissions:
  contents: read

jobs:
  verify:
    if: github.repository == 'AmineAKIK/protocap' && github.ref == 'refs/heads/work/pr03-correction-preparation'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout unchanged PR-02 parent without credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: e9784980433cc871e956f0cce647e8f835e860b5
          path: parent
          persist-credentials: false
      - name: Checkout exact corrected candidate without credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: 93a3002ed97b667934fbfc862eb3a1c40fd73d3e
          path: candidate
          persist-credentials: false
      - name: Setup repository Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: candidate/.nvmrc
      - name: Install both exact dependency graphs
        shell: bash
        run: |
          npm ci --prefix parent
          npm ci --prefix candidate
      - name: Execute identical behavior tests on both versions
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { copyFileSync, readFileSync } from 'node:fs';
          import { createHash } from 'node:crypto';
          import { execFileSync, spawnSync } from 'node:child_process';
          const parentSha = 'e9784980433cc871e956f0cce647e8f835e860b5';
          const candidateSha = '93a3002ed97b667934fbfc862eb3a1c40fd73d3e';
          const test = 'src/pages/ExpiryTemporalRegression.test.tsx';
          const setup = 'src/test/setup.ts';
          for (const [directory, sha] of [['parent', parentSha], ['candidate', candidateSha]]) {
            assert.equal(execFileSync('git', ['rev-parse', 'HEAD'], { cwd: directory, encoding: 'utf8' }).trim(), sha);
          }
          // Only the test and identical jsdom platform shim are copied. No product code is modified.
          copyFileSync(`candidate/${test}`, `parent/${test}`);
          copyFileSync(`candidate/${setup}`, `parent/${setup}`);
          const hash = (path) => createHash('sha256').update(readFileSync(path)).digest('hex');
          assert.equal(hash(`candidate/${test}`), hash(`parent/${test}`));
          assert.equal(hash(`candidate/${setup}`), hash(`parent/${setup}`));
          const results = [];
          for (const directory of ['parent', 'candidate']) {
            const reportPath = `/tmp/pr03-${directory}.json`;
            const result = spawnSync(process.execPath, ['node_modules/vitest/vitest.mjs', 'run', test, '--reporter=json', `--outputFile=${reportPath}`], {
              cwd: directory, env: { ...process.env, TZ: 'Europe/Paris' },
              encoding: 'utf8', timeout: 90000, maxBuffer: 8 * 1024 * 1024,
            });
            if (result.error) throw result.error;
            const report = JSON.parse(readFileSync(reportPath, 'utf8'));
            const assertions = report.testResults.flatMap((suite) => suite.assertionResults);
            console.log('PR03_REGRESSION_RESULT', JSON.stringify({
              directory, status: result.status, numTotalTests: report.numTotalTests,
              numPassedTests: report.numPassedTests, numFailedTests: report.numFailedTests,
              assertions: assertions.map((entry) => ({ title: entry.title, status: entry.status,
                failureMessages: entry.failureMessages.map((message) => message.slice(0, 500)) })),
            }));
            assert.equal(report.numTotalTests, 3);
            assert.equal(assertions.length, 3);
            assert.equal(result.signal, null);
            if (directory === 'parent') {
              assert.equal(result.status, 1);
              assert.equal(report.numFailedTests, 3);
              for (const entry of assertions) {
                assert.equal(entry.status, 'failed');
                assert.ok(entry.failureMessages.some((message) => /AssertionError/.test(message)), 'Expected a behavior assertion, not an import/runtime failure');
                assert.ok(entry.failureMessages.every((message) => !/TypeError|showModal is not a function|Failed to load/.test(message)));
              }
            } else {
              assert.equal(result.status, 0, result.stdout + result.stderr);
              assert.equal(report.numPassedTests, 3);
              assert.equal(report.numFailedTests, 0);
            }
            results.push({ directory, exitCode: result.status, total: report.numTotalTests, passed: report.numPassedTests, failed: report.numFailedTests });
          }
          for (const directory of ['parent', 'candidate']) {
            execFileSync('git', ['diff', '--exit-code', '--', 'package.json', 'package-lock.json', 'src/pages/ExpiryCheckPage.tsx'], { cwd: directory, stdio: 'inherit' });
          }
          console.log('PR03_RED_GREEN_PROVEN', JSON.stringify({ parentSha, candidateSha,
            testSha256: hash(`candidate/${test}`), identicalSetupSha256: hash(`candidate/${setup}`),
            timeZone: 'Europe/Paris', node: process.version, executedAt: new Date().toISOString(), results,
            runUrl: `https://github.com/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}`,
          }));
          NODE
