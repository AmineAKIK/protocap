name: PR-03 isolated preparation

on:
  push:
    branches: [work/pr03-correction-preparation]

permissions:
  contents: read

jobs:
  prepare:
    if: github.repository == 'AmineAKIK/protocap' && github.ref == 'refs/heads/work/pr03-correction-preparation'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: write
    steps:
      - name: Checkout preparation inputs without credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          path: inputs
          persist-credentials: false
      - name: Checkout immutable candidate without credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: 375abcd08889ea485a41fd10b5ffdb8fd86e035d
          path: candidate
          persist-credentials: false
      - name: Setup repository Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: candidate/.nvmrc
      - name: Apply bounded source changes and generate the dependency lock with npm
        working-directory: candidate
        shell: bash
        run: |
          node ../inputs/.github/pr03/prepare.mjs
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { readFileSync, writeFileSync } from 'node:fs';
          import { execFileSync, spawnSync } from 'node:child_process';
          import { createHash } from 'node:crypto';
          assert.equal(Number(process.versions.node.split('.')[0]), 24);
          const read = (path) => JSON.parse(readFileSync(path, 'utf8'));
          const before = read('package-lock.json');
          execFileSync('npm', ['install', '--package-lock-only', '--ignore-scripts', '--save-exact', '@js-temporal/polyfill@0.5.1'], { stdio: 'inherit', timeout: 180000 });
          const after = read('package-lock.json');
          const newPaths = Object.keys(after.packages).filter((path) => !(path in before.packages));
          assert.deepEqual(newPaths.sort(), ['node_modules/@js-temporal/polyfill', 'node_modules/jsbi'].sort());
          for (const [path, entry] of Object.entries(before.packages)) {
            if (path) assert.deepEqual(after.packages[path], entry, `Unexpected change to existing dependency: ${path}`);
          }
          const expectedRoot = structuredClone(before.packages['']);
          expectedRoot.dependencies['@js-temporal/polyfill'] = '0.5.1';
          assert.deepEqual(after.packages[''], expectedRoot);
          const generatedLock = readFileSync('package-lock.json', 'utf8');
          execFileSync('npm', ['ci'], { stdio: 'inherit', timeout: 180000 });
          assert.equal(readFileSync('package-lock.json', 'utf8'), generatedLock);
          const audit = (flags) => {
            const result = spawnSync('npm', ['audit', '--json', '--audit-level=low', ...flags], { encoding: 'utf8', timeout: 120000, maxBuffer: 8 * 1024 * 1024 });
            if (result.error) throw result.error;
            assert.equal(result.status, 0, result.stderr || result.stdout);
            const report = JSON.parse(result.stdout);
            assert.ok(!report.error && report.auditReportVersion === 2);
            assert.equal(report.metadata.vulnerabilities.total, 0);
            return report;
          };
          const fullAudit = audit(['--include=dev']);
          const productionAudit = audit(['--omit=dev']);
          const evidence = {
            schemaVersion: 1, initialCandidate: '375abcd08889ea485a41fd10b5ffdb8fd86e035d',
            preparedAt: new Date().toISOString(), node: process.version,
            npm: execFileSync('npm', ['--version'], { encoding: 'utf8' }).trim(),
            runUrl: `https://github.com/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}`,
            generation: 'npm install --package-lock-only --ignore-scripts --save-exact @js-temporal/polyfill@0.5.1',
            addedPackages: newPaths.map((path) => ({ path, version: after.packages[path].version, integrity: after.packages[path].integrity })),
            existingGraphUnchanged: true, cleanInstallPreservedLock: true,
            lockSha256: createHash('sha256').update(generatedLock).digest('hex'),
            fullAudit, productionAudit,
            scope: 'Dependency generation and audits; full final-SHA validation is tracked separately on PR #176.',
          };
          const evidencePath = 'docs/release-evidence/pr-03-dependency-preparation.json';
          writeFileSync(evidencePath, JSON.stringify(evidence, null, 2) + '\n');
          const paths = [...new Set([...read('/tmp/pr03-changed-paths.json'), 'package-lock.json', evidencePath])];
          writeFileSync('/tmp/pr03-changed-paths.json', JSON.stringify(paths));
          console.log('PR03_DEPENDENCIES_VERIFIED', JSON.stringify(evidence.addedPackages));
          NODE
      - name: Publish content-addressed blobs only
        working-directory: candidate
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { readFileSync } from 'node:fs';
          import { createHash } from 'node:crypto';
          const paths = JSON.parse(readFileSync('/tmp/pr03-changed-paths.json', 'utf8'));
          const tree = [];
          for (const path of paths) {
            assert.ok(!path.startsWith('.github/pr03/') && !path.includes('pr03-preparation'));
            const content = readFileSync(path, 'utf8');
            const response = await fetch('https://api.github.com/repos/AmineAKIK/protocap/git/blobs', {
              method: 'POST',
              headers: { Authorization: `Bearer ${process.env.GH_TOKEN}`, Accept: 'application/vnd.github+json', 'Content-Type': 'application/json', 'X-GitHub-Api-Version': '2022-11-28' },
              body: JSON.stringify({ content, encoding: 'utf-8' }), signal: AbortSignal.timeout(30000),
            });
            if (!response.ok) throw new Error(`Blob publication failed: HTTP ${response.status}`);
            const blob = await response.json();
            const bytes = Buffer.from(content);
            const expected = createHash('sha1').update(`blob ${bytes.length}\0`).update(bytes).digest('hex');
            assert.equal(blob.sha, expected);
            const entry = { path, mode: '100644', type: 'blob', sha: blob.sha };
            tree.push(entry);
            console.log('PR03_VERIFIED_BLOB', JSON.stringify(entry));
          }
          console.log('PR03_VERIFIED_TREE_ENTRIES', JSON.stringify(tree));
          NODE
      - name: Run repository checks on prepared content
        working-directory: candidate
        run: npm run check
