name: Temporary ESLint bootstrap

on:
  push:
    branches:
      - chore/eslint-foundation

permissions:
  contents: write

jobs:
  bootstrap:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chore/eslint-foundation
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Install lint tooling
        run: npm install --save-dev eslint @eslint/js typescript-eslint eslint-plugin-react-hooks globals
      - name: Add flat config and scripts
        shell: bash
        run: |
          cat > eslint.config.mjs <<'EOF'
          import eslint from '@eslint/js';
          import globals from 'globals';
          import reactHooks from 'eslint-plugin-react-hooks';
          import tseslint from 'typescript-eslint';

          export default tseslint.config(
            { ignores: ['dist/**', 'node_modules/**', 'coverage/**'] },
            eslint.configs.recommended,
            ...tseslint.configs.recommended,
            {
              files: ['**/*.{ts,tsx}'],
              languageOptions: {
                globals: {
                  ...globals.browser,
                  ...globals.es2022,
                },
              },
            },
            reactHooks.configs.flat.recommended,
            {
              files: ['server/**/*.mjs', 'server.mjs', 'tests/**/*.mjs', '*.config.{js,mjs,ts}'],
              languageOptions: {
                globals: {
                  ...globals.node,
                  ...globals.es2022,
                },
              },
            },
          );
          EOF
          node --input-type=module <<'EOF'
          import fs from 'node:fs';
          const path = 'package.json';
          const pkg = JSON.parse(fs.readFileSync(path, 'utf8'));
          pkg.scripts.lint = 'eslint . --max-warnings=0';
          pkg.scripts.check = 'npm run check:server && npm test && npm run lint && npm run build';
          fs.writeFileSync(path, `${JSON.stringify(pkg, null, 2)}\n`);
          EOF
      - name: Record lint findings
        run: npm run lint || true
      - name: Commit generated lock and config
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.json package-lock.json eslint.config.mjs
          git commit -m 'chore: add eslint foundation [skip ci]'
          git push
