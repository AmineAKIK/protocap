name: Temporary lockfile refresh

on:
  push:
    branches:
      - chore/dependency-type-hygiene

permissions:
  contents: write

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chore/dependency-type-hygiene
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Regenerate lockfile
        run: npm install --package-lock-only --ignore-scripts
      - name: Remove temporary workflow
        run: git rm .github/workflows/tmp-refresh-lockfile.yml
      - name: Commit generated lockfile
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package-lock.json .github/workflows/tmp-refresh-lockfile.yml
          git commit -m 'chore: regenerate dependency lockfile [skip ci]'
          git push
