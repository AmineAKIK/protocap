name: Quality gate

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Refresh dependency lockfile
        if: github.event_name == 'pull_request' && github.actor != 'github-actions[bot]'
        run: |
          npm install --package-lock-only --ignore-scripts
          if ! git diff --quiet -- package-lock.json; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add package-lock.json
            git commit -m 'chore: regenerate dependency lockfile [skip ci]'
            git push
          fi

      - name: Install dependencies
        run: npm ci

      - name: Verify generated directories are not tracked
        run: |
          if git ls-files node_modules dist | grep -q .; then
            echo "Generated directories must not be tracked."
            git ls-files node_modules dist | head -50
            exit 1
          fi

      - name: Build
        run: npm run check

      - name: Audit production dependencies
        run: npm audit --omit=dev
