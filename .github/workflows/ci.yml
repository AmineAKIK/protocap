name: Quality gate

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  patch-celine:
    name: Apply Celine proxy migration
    if: github.event_name == 'pull_request' && github.head_ref == 'fix/server-side-celine-auth'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}

      - name: Apply audited substitutions
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('src/pages/shiftguide/CelinePage.tsx')
          text = path.read_text()

          if "VITE_DEEPSEEK_API_KEY" not in text and "api.deepseek.com" not in text:
              print('Celine already uses the server proxy.')
              raise SystemExit(0)

          def replace_once(old, new, label):
              global text
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected 1 match, found {count}')
              text = text.replace(old, new, 1)

          replace_once(
              "import { buildSystemPrompt } from '../../data/celineSystemPrompt';\n",
              "import { buildSystemPrompt } from '../../data/celineSystemPrompt';\nimport { getShiftGuideToken, lockShiftGuide } from '../../hooks/useShiftGuideAuth';\n",
              'auth import',
          )
          replace_once(
              "const API_KEY: string = import.meta.env.VITE_DEEPSEEK_API_KEY ?? '';\n\n",
              '',
              'client API key declaration',
          )

          fetch_start = text.index("  const res = await fetch('https://api.deepseek.com/chat/completions', {")
          fetch_end = text.index("\n\n  if (!res.ok) {", fetch_start)
          text = text[:fetch_start] + """  const token = getShiftGuideToken();
  if (!token) throw new Error('Session ShiftGuide expirée. Reconnecte-toi.');

  const res = await fetch('/api/celine/chat', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${token}` },
    body: JSON.stringify({
      messages: [{ role: 'system', content: buildSystemPrompt() }, ...history],
    }),
    signal,
  });""" + text[fetch_end:]

          error_start = text.index("  if (!res.ok) {")
          error_end = text.index("\n\n  const data = await res.json();", error_start)
          text = text[:error_start] + """  if (!res.ok) {
    let errMsg = `Erreur ${res.status}`;
    try {
      const body = await res.json();
      errMsg = typeof body?.error === 'string' ? body.error : errMsg;
    } catch { /* ignore */ }
    if (res.status === 401) {
      lockShiftGuide();
      throw new Error('Session ShiftGuide expirée. Recharge la page pour te reconnecter.');
    }
    if (res.status === 429) throw new Error('Service IA temporairement saturé. Réessaie dans un moment.');
    throw new Error(errMsg);
  }""" + text[error_end:]

          guard_start = text.index("    if (!API_KEY) {")
          guard_end = text.index("\n\n    const currentMessages = messages;", guard_start)
          text = text[:guard_start] + text[guard_end:]

          for forbidden in ('VITE_DEEPSEEK_API_KEY', 'api.deepseek.com', 'const API_KEY'):
              if forbidden in text:
                  raise SystemExit(f'Forbidden client-side secret path remains: {forbidden}')

          path.write_text(text)
          PY

      - name: Commit migration if needed
        run: |
          if git diff --quiet -- src/pages/shiftguide/CelinePage.tsx; then
            echo "No migration commit needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/shiftguide/CelinePage.tsx
          git commit -m "security: route Celine through server proxy"
          git push origin HEAD:${{ github.head_ref }}

  quality:
    name: Quality gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify generated directories are not tracked
        run: |
          if git ls-files node_modules dist | grep -q .; then
            echo "Generated directories must not be tracked."
            git ls-files node_modules dist | head -50
            exit 1
          fi

      - name: Build
        run: npm run check

      - name: Audit production dependencies
        run: npm audit --omit=dev
