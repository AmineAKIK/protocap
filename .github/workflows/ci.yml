name: Quality gate

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality gate
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit full dependency graph for high advisories
        run: npm run audit:full

      - name: Audit production dependencies
        run: npm run audit:prod

      - name: Verify generated directories are not tracked
        run: |
          if git ls-files node_modules dist coverage | grep -q .; then
            echo "Generated directories must not be tracked."
            git ls-files node_modules dist coverage | head -50
            exit 1
          fi

      - name: Run repository checks
        run: npm run check

      - name: Build production container
        run: docker build --tag protocap-ci .

      - name: Install browser engines for E2E
        run: npx playwright install --with-deps chromium webkit

      - name: Run critical Chromium journeys
        run: npm run test:e2e

      - name: Run mobile Chromium and WebKit smoke tests
        run: npm run test:e2e:browser-smoke

      - name: Run accessibility smoke tests
        run: npm run test:e2e:a11y
