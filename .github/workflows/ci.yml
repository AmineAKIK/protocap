name: Quality gate

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify generated directories are not tracked
        run: |
          if git ls-files node_modules dist | grep -q .; then
            echo "Generated directories must not be tracked."
            git ls-files node_modules dist | head -50
            exit 1
          fi

      - name: Build
        run: npm run check

      - name: Audit production dependencies
        run: npm audit --omit=dev
