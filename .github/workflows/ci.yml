name: Quality gate

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality gate
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify generated directories are not tracked
        run: |
          if git ls-files node_modules dist | grep -q .; then
            echo "Generated directories must not be tracked."
            git ls-files node_modules dist | head -50
            exit 1
          fi

      - name: Run repository checks
        run: npm run check

      - name: Build production container
        run: docker build --tag protocap-ci .

      - name: Install Chromium for E2E
        run: npx playwright install --with-deps chromium

      - name: Run critical E2E journeys
        run: npm run test:e2e

      - name: Audit production dependencies
        run: npm audit --omit=dev
