name: Refresh PR7 lockfile

on:
  push:
    branches:
      - test/quality-gates-v2

permissions:
  contents: write

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Refresh lockfile
        run: npm install --package-lock-only --ignore-scripts

      - name: Commit refreshed lockfile and remove one-shot workflow
        run: |
          rm .github/workflows/refresh-pr7-lock.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json .github/workflows/refresh-pr7-lock.yml
          git commit -m "build: refresh npm lockfile for quality gates"
          git push
