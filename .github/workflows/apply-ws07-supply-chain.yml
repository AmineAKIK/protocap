name: Apply WS-07 supply-chain refresh

on:
  push:
    branches:
      - release/ws-07-supply-chain-hygiene

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[ws07-supply-chain-done]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: release/ws-07-supply-chain-hygiene
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Refresh compatible audited graph
        run: |
          npm ci
          npm audit fix --package-lock-only
          npm approve-scripts esbuild
      - name: Remove temporary workflow and commit generated metadata
        run: |
          rm .github/workflows/apply-ws07-supply-chain.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json .github/workflows/apply-ws07-supply-chain.yml
          git commit -m "chore(deps): refresh audited transitive graph [ws07-supply-chain-done]"
          git push origin HEAD:release/ws-07-supply-chain-hygiene
