name: Apply Céline server-proxy patch

on:
  push:
    branches:
      - fix/server-side-celine-auth

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: fix/server-side-celine-auth

      - name: Apply audited substitutions
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('src/pages/shiftguide/CelinePage.tsx')
          text = path.read_text()

          def require_once(marker: str, label: str) -> None:
              count = text.count(marker)
              if count != 1:
                  raise SystemExit(f'{label}: expected 1 match, found {count}')

          def replace_once(old: str, new: str, label: str) -> None:
              global text
              require_once(old, label)
              text = text.replace(old, new, 1)

          def replace_between(start: str, end: str, replacement: str, label: str) -> None:
              global text
              require_once(start, f'{label} start')
              require_once(end, f'{label} end')
              start_index = text.index(start)
              end_index = text.index(end, start_index)
              text = text[:start_index] + replacement + text[end_index:]

          replace_once(
              "import { buildSystemPrompt } from '../../data/celineSystemPrompt';\n",
              "import { buildSystemPrompt } from '../../data/celineSystemPrompt';\nimport { getShiftGuideToken, lockShiftGuide } from '../../hooks/useShiftGuideAuth';\n",
              'auth import',
          )

          replace_once(
              "const API_KEY: string = import.meta.env.VITE_DEEPSEEK_API_KEY ?? '';\n\n",
              '',
              'client API key declaration',
          )

          replace_between(
              "  const res = await fetch('https://api.deepseek.com/chat/completions', {",
              "\n\n  if (!res.ok) {",
              """  const token = getShiftGuideToken();
  if (!token) throw new Error('Session ShiftGuide expirée. Reconnecte-toi.');

  const res = await fetch('/api/celine/chat', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${token}` },
    body: JSON.stringify({
      messages: [{ role: 'system', content: buildSystemPrompt() }, ...history],
    }),
    signal,
  });""",
              'DeepSeek browser fetch',
          )

          replace_between(
              "  if (!res.ok) {",
              "\n\n  const data = await res.json();",
              """  if (!res.ok) {
    let errMsg = `Erreur ${res.status}`;
    try {
      const body = await res.json();
      errMsg = typeof body?.error === 'string' ? body.error : errMsg;
    } catch { /* ignore */ }
    if (res.status === 401) {
      lockShiftGuide();
      throw new Error('Session ShiftGuide expirée. Recharge la page pour te reconnecter.');
    }
    if (res.status === 429) throw new Error('Service IA temporairement saturé. Réessaie dans un moment.');
    throw new Error(errMsg);
  }""",
              'proxy error handling',
          )

          replace_between(
              "    if (!API_KEY) {",
              "\n\n    const currentMessages = messages;",
              '',
              'client API key guard',
          )

          forbidden = ['VITE_DEEPSEEK_API_KEY', 'api.deepseek.com', 'const API_KEY']
          for value in forbidden:
              if value in text:
                  raise SystemExit(f'Forbidden client-side secret path remains: {value}')

          path.write_text(text)
          PY

      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/shiftguide/CelinePage.tsx
          git commit -m "security: route Céline through server proxy"
          git push origin HEAD:fix/server-side-celine-auth
