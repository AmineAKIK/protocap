name: Apply Céline server-proxy patch

on:
  push:
    branches:
      - fix/server-side-celine-auth

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: fix/server-side-celine-auth

      - name: Apply audited substitutions
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path('src/pages/shiftguide/CelinePage.tsx')
          text = path.read_text()

          def replace_literal(old: str, new: str, label: str) -> None:
              global text
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected 1 match, found {count}')
              text = text.replace(old, new, 1)

          def replace_regex(pattern: str, replacement: str, label: str) -> None:
              global text
              text, count = re.subn(pattern, replacement, text, count=1, flags=re.S)
              if count != 1:
                  raise SystemExit(f'{label}: expected 1 match, found {count}')

          replace_literal(
              "import { buildSystemPrompt } from '../../data/celineSystemPrompt';\n",
              "import { buildSystemPrompt } from '../../data/celineSystemPrompt';\nimport { getShiftGuideToken, lockShiftGuide } from '../../hooks/useShiftGuideAuth';\n",
              'auth import',
          )
          replace_regex(
              r"const API_KEY: string = import\.meta\.env\.VITE_DEEPSEEK_API_KEY \?\? '';\n\n",
              '',
              'client API key declaration',
          )
          replace_regex(
              r"  const res = await fetch\('https://api\.deepseek\.com/chat/completions', \{.*?\n  \}\);\n\n  if \(!res\.ok\)",
              """  const token = getShiftGuideToken();
  if (!token) throw new Error('Session ShiftGuide expirée. Reconnecte-toi.');

  const res = await fetch('/api/celine/chat', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${token}` },
    body: JSON.stringify({
      messages: [{ role: 'system', content: buildSystemPrompt() }, ...history],
    }),
    signal,
  });

  if (!res.ok)""",
              'DeepSeek browser fetch',
          )
          replace_regex(
              r"    try \{ const b = await res\.json\(\); errMsg = b\.error\?\.message \?\? errMsg; \} catch \{ /\* ignore \*/ \}\n    if \(res\.status === 401\) throw new Error\('Clé API invalide\. Vérifie la variable VITE_DEEPSEEK_API_KEY\.'\);",
              """    try { const b = await res.json(); errMsg = b.error ?? b.error?.message ?? errMsg; } catch { /* ignore */ }
    if (res.status === 401) {
      lockShiftGuide();
      throw new Error('Session ShiftGuide expirée. Recharge la page pour te reconnecter.');
    }""",
              'proxy error handling',
          )
          replace_regex(
              r"    if \(!API_KEY\) \{\n      setError\('Clé API non configurée\..*?\n      return;\n    \}\n\n",
              '',
              'client API key guard',
          )

          if 'VITE_DEEPSEEK_API_KEY' in text or 'api.deepseek.com' in text or 'API_KEY' in text:
              raise SystemExit('Client-side DeepSeek secret path still present after patch')

          path.write_text(text)
          PY

      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/shiftguide/CelinePage.tsx
          git commit -m "security: route Céline through server proxy"
          git push origin HEAD:fix/server-side-celine-auth
