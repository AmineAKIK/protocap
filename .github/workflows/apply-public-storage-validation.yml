name: Apply public storage validation

on:
  push:
    branches:
      - release/ws-05-validate-public-localstorage

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[public-storage-validation-done]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: release/ws-05-validate-public-localstorage
          fetch-depth: 0

      - name: Wire runtime validators
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def patch(path_value: str, replacements: list[tuple[str, str]]) -> None:
              path = Path(path_value)
              text = path.read_text()
              for old, new in replacements:
                  count = text.count(old)
                  if count != 1:
                      raise SystemExit(f'{path}: expected one match, found {count}: {old[:100]!r}')
                  text = text.replace(old, new, 1)
              path.write_text(text)

          patch('src/pages/LogisticsCallPage.tsx', [
              (
                  "import { logisticsStatusLabels, nextLogisticsId } from '../utils/logistics';",
                  "import { logisticsStatusLabels, nextLogisticsId } from '../utils/logistics';\nimport { isLogisticsRequestList } from '../utils/publicStorageValidation';",
              ),
              (
                  "  const [requests, setRequests] = useLocalStorage<LogisticsRequest[]>('lineops.logistics.requests', initialLogisticsRequests);",
                  "  const [requests, setRequests] = useLocalStorage<LogisticsRequest[]>(\n    'lineops.logistics.requests',\n    initialLogisticsRequests,\n    isLogisticsRequestList\n  );",
              ),
          ])

          patch('src/pages/ExpiryCheckPage.tsx', [
              (
                  "import { getElementStatus, getLineStatus, statusLabel } from '../utils/expiry';",
                  "import { getElementStatus, getLineStatus, statusLabel } from '../utils/expiry';\nimport { isChangeHistoryList, isConditioningLineList } from '../utils/publicStorageValidation';",
              ),
              (
                  "  const [lines, setLines] = useLocalStorage<ConditioningLine[]>('lineops.expiry.lines', initialConditioningLines);\n  const [history, setHistory] = useLocalStorage<ChangeHistoryEntry[]>('lineops.expiry.history', initialChangeHistory);",
                  "  const [lines, setLines] = useLocalStorage<ConditioningLine[]>(\n    'lineops.expiry.lines',\n    initialConditioningLines,\n    isConditioningLineList\n  );\n  const [history, setHistory] = useLocalStorage<ChangeHistoryEntry[]>(\n    'lineops.expiry.history',\n    initialChangeHistory,\n    isChangeHistoryList\n  );",
              ),
          ])

          patch('src/pages/PackingCalculatorPage.tsx', [
              (
                  "} from '../utils/packing';",
                  "} from '../utils/packing';\nimport { isPackingFormState, isPackingTrackingState } from '../utils/publicStorageValidation';",
              ),
              (
                  "  const [form, setForm] = useLocalStorage<PackingFormState>('lineops.packing.form.inputs', defaultForm);\n  const [tracking, setTracking] = useLocalStorage<PackingTrackingState>('lineops.packing.shipment.progress', defaultTracking);",
                  "  const [form, setForm] = useLocalStorage<PackingFormState>(\n    'lineops.packing.form.inputs',\n    defaultForm,\n    isPackingFormState\n  );\n  const [tracking, setTracking] = useLocalStorage<PackingTrackingState>(\n    'lineops.packing.shipment.progress',\n    defaultTracking,\n    isPackingTrackingState\n  );",
              ),
          ])
          PY

      - name: Add hook hydration regression test
        shell: bash
        run: |
          cat > src/hooks/useLocalStorage.test.tsx <<'EOF'
          import { renderHook, waitFor } from '@testing-library/react';
          import { describe, expect, it } from 'vitest';
          import { useLocalStorage } from './useLocalStorage';

          interface StoredCounter {
            count: number;
          }

          function isStoredCounter(value: unknown): value is StoredCounter {
            return (
              typeof value === 'object' &&
              value !== null &&
              !Array.isArray(value) &&
              'count' in value &&
              Number.isSafeInteger((value as { count?: unknown }).count)
            );
          }

          describe('useLocalStorage hydration', () => {
            it('falls back and self-heals when stored JSON has the wrong schema', async () => {
              localStorage.setItem('test.counter.v8', JSON.stringify({ count: 'not-a-number' }));

              const { result } = renderHook(() =>
                useLocalStorage<StoredCounter>('test.counter', { count: 0 }, isStoredCounter)
              );

              expect(result.current[0]).toEqual({ count: 0 });
              await waitFor(() => {
                expect(JSON.parse(localStorage.getItem('test.counter.v8') ?? 'null')).toEqual({ count: 0 });
              });
            });
          });
          EOF

      - name: Add concrete Packing recovery regression
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/pages/PackingCalculatorPage.test.tsx')
          text = path.read_text()
          marker = "\n});\n"
          index = text.rfind(marker)
          if index < 0:
              raise SystemExit('Packing test describe terminator not found')
          test = r'''

  it('recovers from syntactically valid persisted form data with the wrong schema', async () => {
    localStorage.setItem(formStorageKey, JSON.stringify({ quantity: 30880 }));

    render(<PackingCalculatorPage />);

    expect((screen.getByLabelText('Quantité demandée en unités') as HTMLInputElement).value).toBe('');
    expect((screen.getByLabelText('Unités par carton') as HTMLInputElement).value).toBe('');
    expect((screen.getByLabelText('Cartons par palette') as HTMLInputElement).value).toBe('');

    await waitFor(() => {
      expect(JSON.parse(localStorage.getItem(formStorageKey) ?? 'null')).toEqual({
        quantity: '',
        unitsPerCarton: '',
        cartonsPerPalette: '',
        policy: 'no-overrun',
      });
    });
  });
'''
          path.write_text(text[:index] + test + text[index:])
          PY

      - name: Remove temporary workflow and commit final diff
        shell: bash
        run: |
          rm .github/workflows/apply-public-storage-validation.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/hooks/useLocalStorage.test.tsx src/pages/ExpiryCheckPage.tsx src/pages/LogisticsCallPage.tsx src/pages/PackingCalculatorPage.tsx src/pages/PackingCalculatorPage.test.tsx .github/workflows/apply-public-storage-validation.yml
          git commit -m "fix(persistence): wire public storage validators [public-storage-validation-done]"
          git push origin HEAD:release/ws-05-validate-public-localstorage
