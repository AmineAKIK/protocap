name: Fix PR7 async lint findings

on:
  push:
    branches:
      - test/quality-gates-v2

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: test/quality-gates-v2

      - name: Apply explicit async intent
        shell: python
        run: |
          from pathlib import Path

          celine = Path('src/pages/shiftguide/CelinePage.tsx')
          text = celine.read_text()
          replacements = {
              "const sendMessageRef = useRef<(text: string) => void>(() => undefined);": "const sendMessageRef = useRef<(text: string) => Promise<void>>(async () => undefined);",
              "    sendMessageRef.current(transcript);": "    void sendMessageRef.current(transcript);",
              "        markSharedWorkflowComplete(sourceMessage.workflow.runId);": "        void markSharedWorkflowComplete(sourceMessage.workflow.runId);",
              "    setSharedActionStatus(item.actionId, status, findProgressScope(item.actionId));": "    void setSharedActionStatus(item.actionId, status, findProgressScope(item.actionId));",
              "      setSharedWorkflowActionStatus(": "      void setSharedWorkflowActionStatus(",
              "          onConfirm={() => { setConfirmExit(false); navigate('/shiftguide'); }}": "          onConfirm={() => { setConfirmExit(false); void navigate('/shiftguide'); }}",
              "            onClick={() => messages.length === 0 ? navigate('/shiftguide') : setConfirmExit(true)}": "            onClick={() => { if (messages.length === 0) void navigate('/shiftguide'); else setConfirmExit(true); }}",
          }
          for old, new in replacements.items():
              if text.count(old) != 1:
                  raise SystemExit(f'Expected exactly one CelinePage match: {old}')
              text = text.replace(old, new)
          celine.write_text(text)

          module = Path('src/pages/shiftguide/ModuleView.tsx')
          text = module.read_text()
          replacements = {
              "  const leaveModule = () => navigate('/shiftguide', { replace: true });": "  const leaveModule = () => { void navigate('/shiftguide', { replace: true }); };",
              "    setActiveChoiceModule(module.id, subModule.id);": "    void setActiveChoiceModule(module.id, subModule.id);",
          }
          for old, new in replacements.items():
              if text.count(old) != 1:
                  raise SystemExit(f'Expected exactly one ModuleView match: {old}')
              text = text.replace(old, new)
          module.write_text(text)

      - name: Commit fixes and remove one-shot workflow
        run: |
          rm .github/workflows/fix-pr7-async.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/shiftguide/CelinePage.tsx src/pages/shiftguide/ModuleView.tsx .github/workflows/fix-pr7-async.yml
          git commit -m "lint: make async fire-and-forget intent explicit"
          git push origin HEAD:test/quality-gates-v2
