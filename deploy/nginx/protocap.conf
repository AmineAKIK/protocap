# ProtoCap on the VPS: TLS termination for the protected app and the isolated demo.
# nginx OVERWRITES X-Real-IP and X-Forwarded-Proto: the app trusts them (docs/ingress-trust.md),
# so the upstream ports must stay bound to 127.0.0.1 only.
map $http_upgrade $connection_upgrade { default upgrade; '' close; }

server {
    listen 80;
    listen [::]:80;
    server_name protocap.akiksystems.fr demo.protocap.akiksystems.fr;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name protocap.akiksystems.fr;

    ssl_certificate /etc/letsencrypt/live/protocap.akiksystems.fr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/protocap.akiksystems.fr/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name demo.protocap.akiksystems.fr;

    ssl_certificate /etc/letsencrypt/live/demo.protocap.akiksystems.fr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/demo.protocap.akiksystems.fr/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
